<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .stale { color: #fca5a5; font-weight: bold; } .fresh { color: #86efac; }
    #live { min-height: 1.4em; }
    #searchbar { margin: 12px 0; }
    #searchMsg { color: #fbbf24; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    #dossierPanel { margin-top: 28px; }
    #dossierList { list-style: none; padding: 0; }
    #dossierList li { padding: 4px 0; }
    .cols { display: flex; gap: 24px; }
    .cols > div { flex: 1; }
    .cols h5 { margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <div id="searchbar">
        <input id="q" placeholder="测点名片段，如：回风" />
        <button id="doSearch">检索</button>
        <button id="saveDossier">存为卷宗</button>
        <button id="showAll">全部</button>
        <span id="searchMsg"></span>
      </div>
      <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
      <section id="dossierPanel">
        <h3>检索卷宗</h3>
        <ul id="dossierList"></ul>
        <div id="dossierView" hidden>
          <h4 id="dvTitle"></h4>
          <p id="dvMeta"></p>
          <div class="cols">
            <div>
              <h5>存档主键</h5>
              <table><thead><tr><th>主键</th><th>测点(现名)</th><th>状态</th></tr></thead><tbody id="archivedRows"></tbody></table>
            </div>
            <div>
              <h5>此刻重查主键</h5>
              <table><thead><tr><th>主键</th><th>测点</th><th>状态</th></tr></thead><tbody id="currentRows"></tbody></table>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
