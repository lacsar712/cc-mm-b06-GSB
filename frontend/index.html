<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 860px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0 20px; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .searchbar { margin: 12px 0; }
    #search-msg { color: #fcd34d; }
    .stale { color: #fca5a5; font-weight: bold; }
    .valid { color: #86efac; }
    .gap { border-left: 2px solid #78716c; }
    .muted { color: #a8a29e; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>

      <div id="view-list">
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>

        <div class="searchbar">
          <input id="fragment" placeholder="按测点名片段检索，如：回风" />
          <button id="search" type="button">检索</button>
          <button id="mk-dossier" type="button">存成检索卷宗</button>
          <button id="clear-search" type="button">清除检索</button>
          <span id="search-msg"></span>
        </div>

        <table>
          <thead>
            <tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th><th id="th-op" hidden>操作</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>

        <h3>检索卷宗</h3>
        <table>
          <thead><tr><th>卷宗</th><th>片段</th><th>主键数</th><th>建立人</th><th>操作</th></tr></thead>
          <tbody id="dossiers"></tbody>
        </table>
      </div>

      <div id="view-dossier" hidden>
        <button id="dossier-back" type="button">返回列表</button>
        <h3 id="dossier-title"></h3>
        <p id="dossier-meta" class="muted"></p>
        <table>
          <thead>
            <tr>
              <th>存档主键</th><th>存档测点名</th>
              <th class="gap">此刻重查主键</th><th>此刻测点名</th><th class="gap">判定</th>
            </tr>
          </thead>
          <tbody id="dossier-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
